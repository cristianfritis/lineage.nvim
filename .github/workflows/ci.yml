name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo test
        working-directory: engine
        run: cargo test
      - name: Cargo clippy
        working-directory: engine
        run: cargo clippy --all-targets -- -D warnings
      - name: Cargo fmt check
        working-directory: engine
        run: cargo fmt --check
      - name: Cargo check mimalloc
        working-directory: engine
        run: cargo check --features mimalloc

  neovim:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim-version: ["v0.10.4", "v0.11.0", "nightly"]
    continue-on-error: ${{ matrix.nvim-version == 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build lineage-engine
        working-directory: engine
        run: cargo build --release
      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}
      - name: Stylua check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          args: --check plugin lua tests
      - name: Validate checksums.json on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import json, re
          data = json.load(open("checksums.json"))
          for t, e in data["targets"].items():
              sha = e.get("sha256", "")
              if not re.fullmatch(r"[0-9a-f]{64}", sha):
                  raise SystemExit(f"Invalid or TBD sha256 for {t} on release tag: {sha!r}")
          print("checksums.json verified for release tag")
          PY
      - name: Run headless Neovim tests
        run: |
          for t in tests/test_*.lua; do
            nvim --headless -u tests/minimal_init.lua -l "$t"
          done
